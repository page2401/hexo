title: "Hexo 基准文档站"
subtitle: "hexo@8.1.2 · Classic Node.js SSG"
description: "Hexo (hexo@8.1.2) 经典 Node.js 静态站点生成器基准实测子站：Tag Plugins、Warehouse 数据模型与零客户端 JS 构建期 KaTeX"
author: "page2401"
language: zh-CN
timezone: UTC

# URL & Subpath Configuration
url: https://page.2401.xyz/hexo
root: /hexo/
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: true

# Directory Configuration
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing & Build-time Code Highlighting
new_post_name: :title.md
default_layout: page
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: true
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Markdown Renderer (hexo-renderer-marked@7.0.1)
marked:
  gfm: true
  pedantic: false
  breaks: false
  smartLists: true
  smartypants: false
  modifyAnchors: 0
  autolink: true
  mangle: false
  sanitizeUrl: false
  dompurify: false
  prependRoot: true
  postAsset: false
  lazyload: false
  prependRootForUrl: false

# Custom Documentation Theme
theme: bench
